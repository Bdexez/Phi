name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # release: plugins; static: modules linked in; asan: ASan + UBSan.
        include:
          - { preset: release, compiler: g++-14 }
          - { preset: static, compiler: g++-14 }
          - { preset: asan, compiler: g++-14 }
          # Clang 18 lacks the concepts level libstdc++ 14 requires for
          # std::expected; 19 is the first that builds the engine.
          - { preset: release, compiler: clang++-19 }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # mesa-vulkan-drivers brings lavapipe, a CPU Vulkan 1.3 driver, so the
        # Vulkan tests run without a GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 clang-19 \
            libglm-dev libglfw3-dev libgtest-dev libopenal-dev \
            libvulkan-dev glslc mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DBDEX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
