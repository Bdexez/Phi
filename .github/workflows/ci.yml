name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # release: plugins; static: modules linked in; asan: ASan + UBSan.
        preset: [release, static, asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # mesa-vulkan-drivers brings lavapipe, a CPU Vulkan 1.3 driver, so the
        # Vulkan tests run without a GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 \
            libglm-dev libglfw3-dev libgtest-dev \
            libvulkan-dev glslc mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DBDEX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
