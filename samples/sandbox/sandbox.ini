# Sandbox configuration. Every key can be overridden on the command line:
#   ./sandbox --set window.width=1920 --set renderer.vsync=false

[engine]
# Modules loaded at startup, in any order: the engine sorts them by their
# declared dependencies. Swap an entry to change backend, e.g.
#   window_null  instead of window_glfw  -> no window (same as --headless)
#   rhi_null     instead of rhi_vulkan   -> no GPU at all
modules = window_glfw, rhi_vulkan, renderer_forward

[window]
title = bdex sandbox
width = 1280
height = 720

[renderer]
vsync = true
# Anisotropic texture filtering level (1 = off, up to 16).
anisotropy = 8

[rhi]
# Khronos validation layer. Defaults to on in debug builds, off otherwise.
# validation = true

[input]
# Actions and what drives them (comma-separated): keys ("W", "Up",
# "LeftShift"), mouse buttons ("MouseRight"), gamepad buttons ("GamepadA")
# and gamepad axis directions ("LeftStickUp", "RightTrigger").
# Uncomment a line to rebind, e.g. ZQSD on an AZERTY keyboard:
# move_forward = Z, Up, LeftStickUp
# move_back = S, Down, LeftStickDown
# move_left = Q, Left, LeftStickLeft
# move_right = D, Right, LeftStickRight
# move_up = Space, GamepadRightBumper
# move_down = LeftControl, GamepadLeftBumper
# move_fast = LeftShift, RightTrigger
# look = MouseRight
# look_up = RightStickUp
# look_down = RightStickDown
# look_left = RightStickLeft
# look_right = RightStickRight
# screenshot = F2, GamepadY
# profile = F3
# debug_view = F4
# select = MouseLeft
# quit = Escape, GamepadBack
